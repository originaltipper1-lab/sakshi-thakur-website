<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080711">
  <meta name="description" content="Join Sakshi Thakur's official Telegram channel for exclusive daily updates and insights.">
  <title>Sakshi Thakur | Official Channel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <main class="card-wrapper">
    <div class="card">
      <div class="status-badge"><span class="pulse-dot"></span>VIP Telegram Channel</div>
      <div class="avatar-box" aria-hidden="true">
        <div class="avatar-ring"></div>
        <div class="avatar-inner"><svg viewBox="0 0 64 64" class="crown"><defs><linearGradient id="crownGradient"><stop stop-color="#ff416c"/><stop offset=".5" stop-color="#ff4b2b"/><stop offset="1" stop-color="#00f2fe"/></linearGradient></defs><path fill="url(#crownGradient)" d="m8 18 13 11L32 12l11 17 13-11-6 29H14Zm7 33h34v5H15Z"/></svg></div>
        <div class="verified-mark"><svg viewBox="0 0 24 24"><path d="m6 12 4 4 8-8"/></svg></div>
      </div>
      <h1>Sakshi Thakur</h1>
      <p class="tagline">Exclusive Daily Updates &amp; Insights</p>
      <div class="timer-container" role="timer" aria-label="Seconds until Telegram opens">
        <svg class="timer-svg" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff007f"/><stop offset="50%" stop-color="#7928ca"/><stop offset="100%" stop-color="#00f2fe"/></linearGradient></defs><circle class="timer-bg-circle" cx="60" cy="60" r="55"/><circle id="timer-progress" class="timer-bar-circle" cx="60" cy="60" r="55"/></svg>
        <div class="timer-content"><div class="timer-sec" id="timer-count">10</div><div class="timer-label">Seconds</div></div>
      </div>
      <a href="https://t.me/+zz_LuzUKEFAzOGY1" id="join-btn" class="cta-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24Zm5.9 6.6-2 10c-.2.7-.6.9-1.2.5l-3-2.2-1.5 1.4c-.2.2-.3.3-.6.3l.2-3 5.5-5c.2-.2 0-.3-.3-.1l-6.8 4.3-3-.9c-.7-.2-.7-.7.2-1l11.6-4.5c.5-.2 1 .1.9.2Z"/></svg><span>Join Telegram Now</span></a>
      <p class="redirect-note" id="redirect-note">Redirecting automatically in <span id="text-count">10</span>s...</p>
      <noscript><p class="redirect-note">Use the button above to open Telegram.</p></noscript>
    </div>
  </main>
</body>
</html>
